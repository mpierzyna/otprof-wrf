[project]
name = "otprof"
version = "0.2.0"
description = "OTProf: optical-turbulence (Cn2) profiles from reanalysis with a height-aware Squeezeformer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # model, training, inference
    "numpy==2.3.*",
    "scipy==1.16.*",
    "torch==2.8.*",
    "lightning==2.5.*",
    "tensorboardx>=2.6.4",
    "xarray==2025.8.*",
    "dask==2025.9.*",
    "pandas==2.2.*",
    "netcdf4==1.7.*",
    "h5netcdf==1.6.*",
    "pydantic==2.11.*",
    "scikit-learn==1.7.*",
    "joblib>=1.5.3",
    "pyyaml>=6.0",
    "isodate>=0.7",
    # figures and analysis
    "matplotlib==3.10.*",
    "seaborn==0.13.*",
    "jax>=0.9.0",
    # dataset pipeline
    "gcsfs>=2025.12.0",
    "zarr>=3.1",
    "tqdm>=4.67",
    "jinja2>=3.1",
]

[dependency-groups]
dataset = [
    "dvc>=3.60",
]
dev = [
    "ipykernel>=7.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otprof", "src/research_tools"]

[tool.uv]
default-groups = ["dataset", "dev"]

[tool.ruff]
line-length = 120
