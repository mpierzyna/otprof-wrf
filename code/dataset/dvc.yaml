# Dataset pipeline: post-processed WRF output + ERA5 -> training / evaluation datasets.
#
# Every stage runs once per domain (params.yaml `domains`) via `foreach`, with `wdir: data/${key}`, so the
# scripts in this directory execute from inside code/dataset/data/<domain>/ and their relative paths (1_raw/,
# 2_aligned/, ...) resolve there. Script deps therefore carry a `../../` prefix; data deps/outs are relative
# to wdir. Run everything with `dvc repro`, a single domain + stage with e.g. `dvc repro 'make_features@canaries'`.
#
# Outputs per domain read by the models (otprof.pipelines):
#   3_features/wrf_filtered.nc               native WRF profiles (targets, WRF native inputs)
#   3_features/era5_pl.nc, era5_sfc.nc       ERA5 pressure-level and surface inputs
#   4_features_interp/wrf_filtered_era5pl.nc WRF interpolated to the ERA5 pressure levels (WRF PL inputs)
stages:
  link_wrf:
    foreach: ${domains}
    do:
      wdir: data/${key}
      cmd: uv run python ../../step_0_link_wrf.py --wrf-dir ../../../../data/${key}/wrf
      deps:
        - ../../step_0_link_wrf.py
      outs:
        - 1_raw/wrf_cn2:
            cache: false
  download_era5:
    foreach: ${domains}
    do:
      wdir: data/${key}
      cmd: uv run python ../../step_1_download_era5.py --lon-min ${item.area.lon_min} --lon-max ${item.area.lon_max} --lat-max ${item.area.lat_max} --lat-min ${item.area.lat_min}
      deps:
        - ../../step_1_download_era5.py
        - 1_raw/wrf_cn2  # time steps of the WRF data
      outs:
        - 1_raw/era5/pl:
            persist: true
            cache: true
  align_era5_wrf:
    foreach: ${domains}
    do:
      wdir: data/${key}
      cmd: uv run python ../../step_2a_align_era5_wrf.py --dist-th ${item.dist_th} --crop ${item.crop}
      deps:
        - ../../step_2a_align_era5_wrf.py
        - 1_raw/wrf_cn2
        - 1_raw/era5/pl
      outs:
        - 2_aligned/era5_pl_aligned.nc:
            persist: true
            cache: false
        - 2_aligned/era5_sfc_aligned.nc:
            persist: true
            cache: false
        - 2_aligned/wrf_aligned.nc:
            persist: true
            cache: false
        - 2_aligned/report.html:
            persist: true
            cache: false
  make_features:
    foreach: ${domains}
    do:
      wdir: data/${key}
      cmd: uv run python ../../step_3a_make_features.py
      deps:
        - ../../step_3a_make_features.py
        - ../../utils.py
        - 2_aligned/era5_sfc_aligned.nc
        - 2_aligned/era5_pl_aligned.nc
        - 2_aligned/wrf_aligned.nc
      outs:
        - 3_features/era5_sfc.nc:
            persist: true
        - 3_features/era5_pl.nc:
            persist: true
        - 3_features/wrf_all.nc:
            persist: true
            cache: false  # cache only filtered version
  filter_cn2:
    foreach: ${domains}
    do:
      wdir: data/${key}
      cmd: uv run python ../../step_3b_filter_cn2.py
      deps:
        - ../../step_3b_filter_cn2.py
        - 3_features/wrf_all.nc
      outs:
        - 3_features/wrf_filtered.nc:
            persist: true
            cache: true
        - 3_features/filtering.html:
            cache: false
  interpolate_wrf_era5pl:
    foreach: ${domains}
    do:
      wdir: data/${key}
      cmd: uv run python ../../step_4c_interpolate_wrf_era5pl.py
      deps:
        - ../../step_4c_interpolate_wrf_era5pl.py
        - ../../step_3a_make_features.py  # recomputes the WRF features on the pressure levels
        - ../../utils.py
        - 3_features/wrf_filtered.nc
      outs:
        - 4_features_interp/wrf_filtered_era5pl.nc:
            persist: true
            cache: false
