# Machine-specific settings of this workspace, read by the `wrf-massive` CLI and by `pipeline.py` (`load_env()`).
# Keep one env file per machine (e.g. `env_laptop.yaml`, `env_hpc.yaml`) and select it with
# `wrf-massive --env-file env_hpc.yaml ...`, or symlink the active one to `env.yaml`.

wps:
  wps_tmpl_dir: "/path/to/WPS"  # compiled WPS
  geog_data_path: "/path/to/WPS_GEOG"  # WPS static geographical data

wrf:
  wrf_tmpl_dir: "/path/to/WRF"  # compiled WRF

pipeline: "p_default"  # name of a pipeline variable in pipeline.py
log_level: "info"  # debug, info, warning, error or critical
