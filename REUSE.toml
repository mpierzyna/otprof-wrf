version = 1

# Files without room for a comment
[[annotations]]
path = [
    ".dvc/.gitignore",
    ".dvc/config",
    ".dvcignore",
    ".gitignore",
    ".gitmodules",
    ".python-version",
    "CITATION.cff",
    "pyproject.toml",
    "uv.lock",
    "domains/*/.gitignore",
    "domains/*/CERRA_files.txt.gz",
    "domains/*/myoutfields.txt",
    "domains/*/namelist.tmpl.input",
    "domains/*/namelist.tmpl.wps",
    "domains/nl/utils/diag.ipynb",
]
SPDX-FileCopyrightText = "2026 Maximilian Pierzyna"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Simulation directories, generated by wrf-massive (`cli.py init-sims`): headers would be lost when they are regenerated
[[annotations]]
path = "domains/*/sim_*/**"
SPDX-FileCopyrightText = "2026 Maximilian Pierzyna"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Derived from EU_SCORES_project (https://github.com/HarishBaki/EU_SCORES_project), see "Third-party code" in README.md.
# After the generated files above: the last matching annotation applies
[[annotations]]
path = [
    "domains/*/sim_*/2_wps/Vtable.CERRA",
    "domains/*/sim_*/2_wps/run_wps.sh",
    "domains/*/sim_*/2_wps/setup_wps.sh",
]
SPDX-FileCopyrightText = "2024 Harish Baki"
SPDX-License-Identifier = "MIT"
