[project]
name = "otprof-wrf"
version = "0.2.1"
description = "WRF setups to generate high-resolution Cn2 mesoscale simulations"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later AND MIT"
license-files = ["LICENSES/*.txt"]
authors = [
    { name = "Maximilian Pierzyna" },
]
dependencies = []

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pip>=26.1.2",
    "wrf_massive[postproc]",  # the domains use the Cn2 postprocessing stage
]

[tool.uv.sources]
wrf_massive = { path = "submodules/wrf-massive", editable = true }

[tool.ruff]
line-length = 120  # align with pycharm

# Release: `uvx bump-my-version bump patch|minor|major` updates the files below, commits and tags
[tool.bumpversion]
current_version = "0.2.1"
commit = true
tag = true
tag_name = "v{new_version}"
message = "Bump version: {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "uv.lock"
regex = true
search = '^name = "otprof-wrf"\nversion = "\d+\.\d+\.\d+"$'
replace = """name = "otprof-wrf"
version = "{new_version}\""""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = """
name = "otprof-wrf"
version = "{current_version}"
"""
replace = """
name = "otprof-wrf"
version = "{new_version}"
"""

# The software's version and release date only, not the versions of its references.
# The Zenodo DOIs and citations in README.md are static on purpose and not bumped
[[tool.bumpversion.files]]
filename = "CITATION.cff"
regex = true
search = '^version: {current_version}\ndate-released: "\d{{4}}-\d{{2}}-\d{{2}}"$'
replace = """version: {new_version}
date-released: "{now:%Y-%m-%d}\""""
